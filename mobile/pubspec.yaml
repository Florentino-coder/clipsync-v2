name: clipsync_app
description: Clipboard sync from PC to phone

publish_to: "none"

version: 0.9.11+38

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_foreground_task: 8.17.0
  flutter_local_notifications: ^18.0.1
  mobile_scanner: 7.2.0
  shared_preferences: 2.3.2
  url_launcher: 6.3.1
  permission_handler: ^11.0.0
  google_mlkit_text_recognition: ^0.13.0
  uuid: ^4.0.0
  path_provider: ^2.1.0
  shelf: ^1.4.0
  shelf_web_socket: ^2.0.0
  crypto: ^3.0.0
  image: ^4.0.0
  ed25519_edwards: ^0.3.1
  android_id: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# path_provider_foundation 2.6+ pulls objective_c native-assets hooks that break
# `flutter test` on this Windows Flutter 3.44 toolchain (space/drive path).
dependency_overrides:
  path_provider_foundation: 2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/banks/
